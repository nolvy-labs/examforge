name: .NET Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/examforge-api/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "apps/examforge-api/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: examforge-api-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  BACKEND_DIR: "apps/examforge-api"
  SOLUTION_FILE: "ExamForge.slnx"
  CONFIGURATION: "Release"

jobs:
  build-and-test:
    name: Restore, Build, Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Display .NET info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          --no-build
          --collect:"XPlat Code Coverage"
  publish-images:
    name: Publish ${{ matrix.image }}
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
        
    strategy:
      matrix:
        include:
          - target: final
            image: examforge-api
          - target: migrations
            image: examforge-migrations
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: apps/examforge-api
          file: apps/examforge-api/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nolvy-labs/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nolvy-labs/examforge
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true
        
  deploy-production:
    name: Deploy production API
    needs: publish-images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
        
    environment:
      name: production
      url: https://api.examforge.io.vn
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts
        
      - name: Upload deployment files
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          chmod +x apps/examforge-api/scripts/deploy-production.sh
          chmod +x apps/examforge-api/scripts/verify-production-readiness.sh
        
          scp \
            docker-compose.production.yml \
            "$SSH_USER@$SSH_HOST:/opt/examforge/docker-compose.production.yml"
        
          scp \
            apps/examforge-api/scripts/deploy-production.sh \
            "$SSH_USER@$SSH_HOST:/opt/examforge/deploy-production.sh"
        
          scp \
            apps/examforge-api/scripts/verify-production-readiness.sh \
            "$SSH_USER@$SSH_HOST:/opt/examforge/verify-production-readiness.sh"
        
      - name: Deploy release
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
          "/opt/examforge/deploy-production.sh '$RELEASE_SHA'"
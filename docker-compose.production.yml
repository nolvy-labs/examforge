name: examforge-production

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:5001

  ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection:?Set ConnectionStrings__DefaultConnection}"

  Jwt__Secret: "${JWT_SECRET:?Set JWT_SECRET}"
  Jwt__Issuer: "${JWT_ISSUER:?Set JWT_ISSUER}"
  Jwt__Audience: "${JWT_AUDIENCE:?Set JWT_AUDIENCE}"
  Jwt__AccessTokenMinutes: "${JWT_ACCESS_TOKEN_MINUTES:-15}"
  Jwt__RefreshTokenDays: "${JWT_REFRESH_TOKEN_DAYS:-7}"

  Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN_0:?Set Study HTTPS origin}"
  Cors__AllowedOrigins__1: "${CORS_ALLOWED_ORIGIN_1:?Set Admin HTTPS origin}"

  ForwardedHeaders__KnownNetworks__0: "${FORWARDED_HEADERS_KNOWN_NETWORK_0:?Set proxy network}"

services:
  migrations:
    image: "${MIGRATIONS_IMAGE:?Set MIGRATIONS_IMAGE}"
    environment: *api-environment
    restart: "no"
    networks:
      - backend

  api:
    image: "${API_IMAGE:?Set API_IMAGE}"
    restart: unless-stopped
    environment: *api-environment
    ports:
      - "127.0.0.1:5001:5001"
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "3",
          "--header",
          "Host: api.examforge.io.vn",
          "http://127.0.0.1:5001/health/ready"
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

networks:
  backend:
    name: examforge-production-backend
    ipam:
      config:
        - subnet: 172.30.0.0/24
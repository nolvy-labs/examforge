name: examforge-production

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:5001
  ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection:?Set ConnectionStrings__DefaultConnection in the deployment environment}"
  Jwt__Secret: "${JWT_SECRET:?Set JWT_SECRET in the deployment environment}"
  Jwt__Issuer: "${JWT_ISSUER:?Set JWT_ISSUER in the deployment environment}"
  Jwt__Audience: "${JWT_AUDIENCE:?Set JWT_AUDIENCE in the deployment environment}"
  Jwt__AccessTokenMinutes: "${JWT_ACCESS_TOKEN_MINUTES:-15}"
  Jwt__RefreshTokenDays: "${JWT_REFRESH_TOKEN_DAYS:-7}"
  Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN_0:?Set the exact Study HTTPS origin}"
  Cors__AllowedOrigins__1: "${CORS_ALLOWED_ORIGIN_1:?Set the exact Admin HTTPS origin}"
  ForwardedHeaders__KnownNetworks__0: "${FORWARDED_HEADERS_KNOWN_NETWORK_0:?Set the immediate proxy/container network CIDR}"

services:
  migrations:
    build:
      context: ./apps/examforge-api
      dockerfile: Dockerfile
      target: migrations
    environment: *api-environment
    restart: "on-failure:3"

  api:
    build:
      context: ./apps/examforge-api
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment: *api-environment
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "3",
          "http://127.0.0.1:5001/health/ready"
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

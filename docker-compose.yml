name: examforge-local

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:5001
  ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection:?Set ConnectionStrings__DefaultConnection in .env}"
  Jwt__Secret: "${JWT_Secret:?Set JWT_Secret in .env}"
  Jwt__Issuer: "${JWT_ISSUER:?Set JWT_ISSUER in .env}"
  Jwt__Audience: "${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}"
  Jwt__AccessTokenMinutes: "${JWT_ACCESS_TOKEN_MINUTES:?Set JWT_ACCESS_TOKEN_MINUTES in .env}"
  Jwt__RefreshTokenDays: "${JWT_REFRESH_TOKEN_DAYS:?Set JWT_REFRESH_TOKEN_DAYS in .env}"

services:
  migrations:
    build:
      context: ./apps/examforge-api
      dockerfile: Dockerfile
      target: migrations
    environment: *api-environment
    restart: "on-failure:3"

  api:
    build:
      context: ./apps/examforge-api
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment: *api-environment
    ports:
      - "${API_PORT:-5001}:5001"
    depends_on:
      migrations:
        condition: service_completed_successfully